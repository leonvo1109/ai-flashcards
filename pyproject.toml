[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anki-add-ons"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "anki>=25.9.2",
  "aqt>=25.9.2",
  "python-dotenv>=1.0.0",
]

[tool.hatch.envs.default]
skip-install = true
dependencies = [
  "black",
  "ruff",
  "mypy"
]

[tool.hatch.envs.default.scripts]
vendor = "python scripts/vendor_dependencies.py"
build = "python scripts/build_all.py --skip-vendor"
install-dev = "python scripts/install_dev.py --addon ai_flashcards"
run-anki = "python runanki.py"
dev = "python scripts/dev.py all"
dev-build = "python scripts/dev.py build --addon ai_flashcards --skip-vendor"
dev-install = "python scripts/dev.py install --addon ai_flashcards"
fmt = [
  "black .",
  "ruff check --fix ."
]
check = [
  "black --check .",
  "ruff check .",
  "mypy ."
]

[tool.uv]
package = false

[tool.ruff.lint.per-file-ignores]
# Vendored / dynamic Apple Intelligence SDK shim uses star-imports until typed.
"packages/ai_flashcards/llm/providers/apple_provider.py" = ["F403", "F405"]
