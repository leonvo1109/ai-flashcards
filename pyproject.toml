[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-flashcards"
version = "0.1.0"
description = "AI Flashcards — Anki add-on (source repository)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "anki>=25.9.2",
  "aqt>=25.9.2",
  "nest-asyncio>=1.6.0",
  "python-dotenv>=1.0.0",
]

[project.urls]
Repository = "https://github.com/leonvo1109/ai-flashcards"

[tool.hatch.envs.default]
skip-install = true
dependencies = [
  "black",
  "pytest>=8.3",
  "ruff",
  "mypy"
]

[tool.hatch.envs.default.scripts]
vendor = "python scripts/vendor_dependencies.py"
build = "python scripts/build_all.py --skip-vendor"
install-dev = "python scripts/install_dev.py"
run-anki = "python runanki.py"
dev = "python scripts/dev.py all"
dev-build = "python scripts/dev.py build --skip-vendor"
dev-install = "python scripts/dev.py install"
fmt = [
  "black ai_flashcards scripts tests runanki.py",
  "ruff check --fix ai_flashcards scripts tests runanki.py",
]
check = [
  "black --check ai_flashcards scripts tests runanki.py",
  "ruff check ai_flashcards scripts tests runanki.py",
  "mypy scripts",
]
test = "pytest {args}"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "black>=24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["ai_flashcards", "scripts", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["ai_flashcards", "tests"]

[tool.mypy]
# Vendored wheels live under ai_flashcards/lib/ (helps when running broader `mypy` locally).
exclude = "ai_flashcards/lib/"

[tool.ruff.lint.per-file-ignores]
# Vendored / dynamic Apple Intelligence SDK shim uses star-imports until typed.
"ai_flashcards/llm/providers/apple_provider.py" = ["F403", "F405"]
